services:
  - type: web
    name: villa-estela
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    disk:
      name: villa-estela-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    startCommand: php artisan optimize:clear && php artisan storage:link && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      - key: APP_NAME
        value: Villa Estela
      - key: MAIL_FROM_NAME
        value: Villa Estella
      - key: LOG_LEVEL
        value: info
      # Neon PostgreSQL connection. Set real values in Render Dashboard.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: XENDIT_API_KEY
        sync: false
      - key: XENDIT_WEBHOOK_VERIFICATION_TOKEN
        sync: false

