services:
  - type: web
    name: villa-estela
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    startCommand: mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions storage/logs storage/app/public && php artisan optimize:clear && php artisan storage:link --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      - key: APP_NAME
        value: Villa Estela
      - key: MAIL_FROM_NAME
        value: Villa Estella
      - key: LOG_LEVEL
        value: info
      # Neon PostgreSQL connection. Set real values in Render Dashboard.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
      # Preferred durable upload storage: configure AWS/R2/B2 values in Render Dashboard.
      # If using the Render disk fallback instead, set FILESYSTEM_UPLOADS_DISK=public.
      - key: FILESYSTEM_UPLOADS_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true
      - key: XENDIT_MODE
        value: test
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_INVOICE_BASE_URL
        value: https://api.xendit.co
      - key: XENDIT_WEBHOOK_VERIFICATION_TOKEN
        sync: false

