services:
  - type: web
    name: villa-estella
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    startCommand: php artisan serve --host=0.0.0.0 --port=8000
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: Villa Estella
      - key: MAIL_FROM_NAME
        value: Villa Estella
      # Neon PostgreSQL connection
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: villa-estella-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: villa-estella-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: villa-estella-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: villa-estella-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: villa-estella-db
          property: password
      # Add these as environment variables (not secrets) if needed
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: villa-estella-db
    # Note: Render's managed Postgres is ~$7/month on starter plan
    # For FREE tier, use Neon instead (see instructions below)
    # Uncomment the lines below if you want to use Render's managed database:
    # databaseEngine: postgresql
    # version: "15"
    # plan: starter
    # postgresSQLVersion: "15"
    # ipAllowList:
    #   - source: "%"
    #     description: "Allow all"
