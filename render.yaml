services:
  - type: web
    name: villa-estella
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    startCommand: php artisan serve --host=0.0.0.0 --port=8000
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: Villa Estella
      - key: MAIL_FROM_NAME
        value: Villa Estella
      # Neon PostgreSQL connection. Fill these in Render's Environment tab.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: your-neon-host.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: villa_estella
      - key: DB_USERNAME
        value: your_neon_user
      - key: DB_PASSWORD
        value: your_neon_password
      - key: DB_SSLMODE
        value: require
      # Add these as environment variables if needed
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
