services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villa-estella-app
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - villa-net

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: villa-estella-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hotel_booking
      MYSQL_USER: villa_user
      MYSQL_PASSWORD: villa_secret
    volumes:
      - villa-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - villa-net

  # phpMyAdmin (optional — access at http://localhost:8080)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: villa-estella-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - villa-net

volumes:
  villa-db-data:

networks:
  villa-net:
    driver: bridge
